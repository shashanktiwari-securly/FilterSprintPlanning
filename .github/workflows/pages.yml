name: Deploy dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

# Requires Pages to be on (Settings → Pages → Source: GitHub Actions).
# enablement: true tries to turn that on automatically; it still needs
# admin access on the repo, so the Settings click may be required once.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
